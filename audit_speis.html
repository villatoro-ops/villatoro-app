<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Auditoría SPEIs</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const app = initializeApp({
    apiKey: "AIzaSyBT3KfII_PvabcO-ovZPBUhGXG2d9KPs6s",
    authDomain: "villatoro-app.firebaseapp.com",
    projectId: "villatoro-app",
  });
  const db = getFirestore(app);
  const auth = getAuth(app);

  function fmt(n) { return '$' + (Number(n)||0).toLocaleString('es-MX', {minimumFractionDigits:2}); }

  window.auditar = async function() {
    const pass = document.getElementById('pass').value;
    const log = document.getElementById('log');
    const btn = document.getElementById('btn');
    btn.disabled = true;
    log.innerHTML = 'Iniciando sesión...<br>';

    try {
      await signInWithEmailAndPassword(auth, 'villatoro.comercializadora@gmail.com', pass);
      log.innerHTML += '✅ Sesión iniciada<br><br>';

      const [speiSnap, facSnap] = await Promise.all([
        getDocs(collection(db, 'speis')),
        getDocs(collection(db, 'facturas'))
      ]);

      // Build factura map
      const facMap = {};
      facSnap.docs.forEach(d => { facMap[d.id] = d.data(); });

      // Analyze each SPEI
      var totalSPEIs = 0, totalMonto = 0;
      var sinAplicar = [], aplicadosSinFactura = [], diferencias = [];

      speiSnap.docs.forEach(d => {
        const s = d.data();
        totalSPEIs++;
        const monto = Number(s.monto)||0;
        totalMonto += monto;

        if(!s.aplicado) {
          sinAplicar.push({ num: s.numero||d.id, monto, ordenante: s.ordenante||'' });
          return;
        }

        // Find linked facturas
        let facturasVinculadas = [];
        facSnap.docs.forEach(fd => {
          const f = fd.data();
          if(f.spei === s.numero || f.referenciaPago === s.numero) {
            facturasVinculadas.push({ id: fd.id, ...f });
          }
        });

        if(s.relacion) {
          s.relacion.split(',').forEach(r => {
            const match = facSnap.docs.find(fd => (fd.data().folio||'').trim().toUpperCase() === r.trim().toUpperCase());
            if(match && !facturasVinculadas.find(f => f.id === match.id)) {
              facturasVinculadas.push({ id: match.id, ...match.data() });
            }
          });
        }

        if(!facturasVinculadas.length) {
          aplicadosSinFactura.push({ num: s.numero||d.id, monto, ordenante: s.ordenante||'', fecha: s.fecha||'' });
          return;
        }

        // Check monto diff
        const sumFac = facturasVinculadas.reduce((s,f) => s + (Number(f.total)||0), 0);
        const diff = Math.abs(monto - sumFac);
        if(diff > 50) {
          diferencias.push({ num: s.numero||d.id, monto, sumFac, diff, ordenante: s.ordenante||'' });
        }
      });

      // Render results
      log.innerHTML += `<b>📊 RESUMEN</b><br>`;
      log.innerHTML += `Total SPEIs: ${totalSPEIs} — ${fmt(totalMonto)}<br><br>`;

      if(sinAplicar.length) {
        log.innerHTML += `<b style="color:orange">⚠️ SIN APLICAR (${sinAplicar.length})</b><br>`;
        sinAplicar.forEach(s => {
          log.innerHTML += `&nbsp;&nbsp;💳 ${s.num} — ${fmt(s.monto)} — ${s.ordenante}<br>`;
        });
        log.innerHTML += '<br>';
      } else {
        log.innerHTML += `✅ Todos los SPEIs están marcados como aplicados<br><br>`;
      }

      if(aplicadosSinFactura.length) {
        log.innerHTML += `<b style="color:red">🔴 APLICADOS SIN FACTURAS VINCULADAS (${aplicadosSinFactura.length})</b><br>`;
        aplicadosSinFactura.forEach(s => {
          log.innerHTML += `&nbsp;&nbsp;💳 ${s.num} — ${fmt(s.monto)} — ${s.ordenante} — ${s.fecha}<br>`;
        });
        log.innerHTML += '<br>';
      } else {
        log.innerHTML += `✅ Todos los SPEIs aplicados tienen facturas vinculadas<br><br>`;
      }

      if(diferencias.length) {
        log.innerHTML += `<b style="color:orange">🟡 DIFERENCIAS DE MONTO (${diferencias.length})</b><br>`;
        diferencias.forEach(s => {
          log.innerHTML += `&nbsp;&nbsp;💳 ${s.num} — SPEI: ${fmt(s.monto)} vs Facturas: ${fmt(s.sumFac)} — Diff: ${fmt(s.diff)}<br>`;
        });
      } else {
        log.innerHTML += `✅ Sin diferencias de monto significativas<br>`;
      }

      btn.textContent = '✅ Listo';
    } catch(e) {
      log.innerHTML += '❌ Error: ' + e.message;
      btn.disabled = false;
    }
  };
</script>
<style>
body{font-family:-apple-system,sans-serif;max-width:600px;margin:2rem auto;padding:1rem;background:#f5f6f8}
.card{background:white;border-radius:12px;padding:1.5rem;box-shadow:0 2px 12px rgba(0,0,0,.08)}
input{width:100%;padding:10px;border:1.5px solid #E2E8EF;border-radius:8px;font-size:14px;box-sizing:border-box;margin:.5rem 0}
button{width:100%;padding:12px;background:#1F4E79;color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;margin-top:.5rem}
button:disabled{opacity:.6}
#log{margin-top:1rem;background:#f0f4f8;border-radius:8px;padding:.75rem;font-size:12px;line-height:2;max-height:500px;overflow-y:auto}
</style>
</head>
<body>
<div class="card">
  <h2 style="color:#1F4E79;margin-bottom:.5rem">🔍 Auditoría SPEIs vs Facturas</h2>
  <p style="color:#666;font-size:13px">Verifica qué SPEIs están sin aplicar o sin facturas vinculadas</p>
  <input type="password" id="pass" placeholder="Contraseña">
  <button id="btn" onclick="auditar()">🔍 Auditar</button>
  <div id="log">Esperando...</div>
</div>
</body>
</html>
