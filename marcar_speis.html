<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcar SPEIs como aplicados</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const app = initializeApp({
    apiKey: "AIzaSyBT3KfII_PvabcO-ovZPBUhGXG2d9KPs6s",
    authDomain: "villatoro-app.firebaseapp.com",
    projectId: "villatoro-app",
    storageBucket: "villatoro-app.firebasestorage.app",
    messagingSenderId: "332539765979",
    appId: "1:332539765979:web:630a3e9a626b37a19418fe"
  });
  const db = getFirestore(app);
  const auth = getAuth(app);

  // SPEIs históricos importados — ya aplicados
  const SPEIS_APLICADOS = [
    'No:121952359','No.121952418','No:122965735','No:123227812',
    'No:123508272','No:123837026','No:125104935','No:125302501',
    'No:126122320','No:127450080','No:127695798','No:128700158',
    'No.129174782','No.129178068','No.129229945','No.129439363'
  ];

  window.marcar = async function() {
    const email = document.getElementById('email').value;
    const pass = document.getElementById('pass').value;
    const log = document.getElementById('log');
    const btn = document.getElementById('btn');
    btn.disabled = true;
    log.innerHTML = 'Iniciando sesión...<br>';

    try {
      await signInWithEmailAndPassword(auth, email, pass);
      log.innerHTML += '✅ Sesión iniciada<br>';

      const snap = await getDocs(collection(db, 'speis'));
      let marked = 0, skipped = 0;

      for (const d of snap.docs) {
        const s = d.data();
        if (s.aplicado) { skipped++; continue; }
        // Mark as applied if it's a historical SPEI or if imported
        if (s.importado || SPEIS_APLICADOS.includes(s.numero)) {
          await updateDoc(doc(db, 'speis', d.id), { aplicado: true });
          marked++;
          log.innerHTML += `✅ Marcado: ${s.numero} — $${(s.monto||0).toLocaleString('es-MX')}<br>`;
        }
      }

      log.innerHTML += `<br><strong style="color:#2e7d32">Listo: ${marked} SPEIs marcados como aplicados. ${skipped} ya estaban marcados.</strong>`;
      btn.textContent = '✅ Completado';
    } catch(e) {
      log.innerHTML += `❌ Error: ${e.message}`;
      btn.disabled = false;
    }
  };
</script>
<style>
body{font-family:-apple-system,sans-serif;max-width:420px;margin:2rem auto;padding:1rem;background:#f5f6f8}
.card{background:white;border-radius:12px;padding:1.5rem;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h2{color:#1F4E79;margin-bottom:.5rem}
p{color:#666;font-size:13px;margin-bottom:1rem}
label{display:block;font-size:11px;font-weight:600;color:#666;text-transform:uppercase;margin-bottom:4px;margin-top:.75rem}
input{width:100%;padding:10px 12px;border:1.5px solid #E2E8EF;border-radius:8px;font-size:14px;box-sizing:border-box}
button{width:100%;margin-top:1rem;padding:12px;background:#1F4E79;color:white;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer}
button:disabled{opacity:.6}
#log{margin-top:1rem;background:#f0f4f8;border-radius:8px;padding:.75rem;font-size:12px;line-height:1.8;min-height:60px}
</style>
</head>
<body>
<div class="card">
  <h2>Marcar SPEIs históricos</h2>
  <p>Marca los 16 SPEIs importados como "aplicados" para que no aparezcan en el conciliador.</p>
  <label>Correo</label>
  <input type="email" id="email" value="villatoro.comercializadora@gmail.com">
  <label>Contraseña</label>
  <input type="password" id="pass" placeholder="Tu contraseña">
  <button id="btn" onclick="marcar()">Marcar SPEIs como aplicados</button>
  <div id="log">Esperando...</div>
</div>
</body>
</html>
