<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Verificar OCs</title>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const app = initializeApp({
    apiKey: "AIzaSyBT3KfII_PvabcO-ovZPBUhGXG2d9KPs6s",
    authDomain: "villatoro-app.firebaseapp.com",
    projectId: "villatoro-app",
    storageBucket: "villatoro-app.firebasestorage.app",
    messagingSenderId: "332539765979",
    appId: "1:332539765979:web:630a3e9a626b37a19418fe"
  });
  const db = getFirestore(app);
  const auth = getAuth(app);

  // Base Excel data
  const BASE = {
    'OC13369':  {arts:1,  total:870.00},
    'OC19972':  {arts:21, total:180562.12},
    'OC20057':  {arts:17, total:93161.92},
    'OC20204':  {arts:8,  total:18785.04},
    'OC20423':  {arts:2,  total:2053.20},
    'OC20424':  {arts:2,  total:2315.36},
    'OC20425':  {arts:2,  total:1078.80},
    'OC20580':  {arts:1,  total:243.60},
    'OC20581':  {arts:1,  total:197.20},
    'OC20582':  {arts:4,  total:9662.80},
    'OC20583':  {arts:5,  total:28290.08},
    'OC20584':  {arts:2,  total:3995.04},
    'OC20658':  {arts:3,  total:2430.90},
    'OC20659':  {arts:2,  total:1670.40},
    'OC20744':  {arts:1,  total:2031.02},
    'OC20783':  {arts:1,  total:9814.99},
    'OC20784':  {arts:1,  total:19105.20},
    'OC20848':  {arts:1,  total:8922.72},
    'OC20893':  {arts:7,  total:47188.80},
    'OC20969':  {arts:1,  total:2900.00},
    'OC20973':  {arts:1,  total:8505.99},
    'OC69218':  {arts:2,  total:4326.80},
  };

  const fmt = n => Number(n).toLocaleString('es-MX',{style:'currency',currency:'MXN'});

  window.verificar = async function() {
    const pass = document.getElementById('pass').value;
    const log = document.getElementById('log');
    log.innerHTML = 'Iniciando sesión...<br>';
    try {
      await signInWithEmailAndPassword(auth, 'villatoro.comercializadora@gmail.com', pass);
      log.innerHTML += '✅ Sesión iniciada — leyendo OCs...<br><br>';

      const snap = await getDocs(collection(db,'ocs'));
      let html = '<table border="1" cellpadding="6" style="border-collapse:collapse;font-size:12px;width:100%">';
      html += '<tr style="background:#1F4E79;color:white"><th>OC</th><th>Arts Firebase</th><th>Arts Excel</th><th>Total Firebase</th><th>Total Excel</th><th>Diferencia</th><th>Status</th></tr>';

      let errores = 0;
      snap.docs.forEach(d => {
        const oc = d.data();
        const num = oc.numero || '';
        const base = BASE[num];
        if(!base) return; // OC nueva, no estaba en el Excel base

        const artsFirebase = oc.articulos ? oc.articulos.length : 0;
        const totalFirebase = Number(oc.totalOC) || 0;
        const diffArts = artsFirebase - base.arts;
        const diffTotal = totalFirebase - base.total;
        const ok = Math.abs(diffTotal) < 1 && diffArts === 0;
        if(!ok) errores++;

        const color = ok ? '#E8F5E9' : '#FFEBEE';
        const icon = ok ? '✅' : '❌';
        html += `<tr style="background:${color}">
          <td><b>${num}</b></td>
          <td style="text-align:center">${artsFirebase}</td>
          <td style="text-align:center">${base.arts}</td>
          <td style="text-align:right">${fmt(totalFirebase)}</td>
          <td style="text-align:right">${fmt(base.total)}</td>
          <td style="text-align:right;color:${Math.abs(diffTotal)<1?'green':'red'}">${fmt(diffTotal)}</td>
          <td style="text-align:center">${icon} ${ok?'OK':'REVISAR'}</td>
        </tr>`;
      });

      html += '</table>';
      html += `<br><b>${errores} OC(s) con diferencias encontradas</b>`;
      log.innerHTML += html;
    } catch(e) {
      log.innerHTML += '❌ Error: ' + e.message;
    }
  };
</script>
<style>
body{font-family:-apple-system,sans-serif;max-width:900px;margin:1rem auto;padding:1rem}
.card{background:white;border-radius:12px;padding:1.5rem;box-shadow:0 2px 12px rgba(0,0,0,.08)}
input{padding:10px;border:1.5px solid #ccc;border-radius:8px;font-size:14px;width:200px}
button{padding:10px 20px;background:#1F4E79;color:white;border:none;border-radius:8px;font-size:14px;cursor:pointer;margin-left:8px}
#log{margin-top:1rem;font-size:12px;overflow-x:auto}
</style>
</head>
<body>
<div class="card">
  <h2 style="color:#1F4E79;margin-bottom:1rem">🔍 Verificar OCs vs Excel base 28/05/2026</h2>
  <p style="color:#666;font-size:13px;margin-bottom:1rem">Compara las OCs en Firebase contra el Excel original para detectar artículos o montos faltantes.</p>
  <input type="password" id="pass" placeholder="Contraseña">
  <button onclick="verificar()">Verificar ahora</button>
  <div id="log"></div>
</div>
</body>
</html>
